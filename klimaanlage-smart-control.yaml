blueprint:
  name: Klimaanlage Smart Control
  description: 'Steuert eine Split-Klimaanlage intelligent basierend auf Raum- und
    Außentemperatur. Optionale Fußbodenheizungs-Koordination (wird abgeschaltet wenn
    die Klimaanlage läuft), Fenstersensor-Unterstützung (AC stoppt bei geöffnetem
    Fenster und startet nicht erneut bis es geschlossen ist), Haus- und Raum-Präsenz,
    Urlaubs-Sperre, adaptiver Cooling-Target, Lüften-Vorrang (kein Einschalten wenn
    es draußen deutlich kühler ist als im Raum, mit harter Kühl-Obergrenze gegen
    interne Wärmequellen wie 3D-Drucker), Selbstregelung, sowie optionale
    Modi-Phasen (Eco / Super-Boost beim Start / Sleep-Mode mit Profilauswahl) mit
    Wochentag-Filter. Manuelle Eingriffe (UI / App / Voice) werden via context.user_id
    erkannt und überschreiben die Automation bis zum nächsten Aktiv-Zeitfenster —
    nur Urlaub und Fenster-offen bleiben harte Safety-Overrides.

    '
  domain: automation
  author: disane
  input:
    section_geraet:
      name: Gerät & Sensoren
      icon: mdi:air-conditioner
      input:
        climate_entity:
          name: Klimaanlage
          description: 'Climate-Entity der Split-Klimaanlage. Getestet mit ConnectLife
            (Hisense / AEG), sollte aber mit jeder Integration funktionieren die
            climate.set_hvac_mode + climate.set_temperature unterstützt.

            '
          selector:
            entity:
              domain:
              - climate
              reorder: false
              multiple: false
        room_temp_sensor:
          name: Raumtemperatursensor
          description: Sensor der die Temperatur des Raums misst in dem die Klimaanlage
            steht.
          selector:
            entity:
              domain:
              - sensor
              device_class:
              - temperature
              reorder: false
              multiple: false
        outdoor_temp_sensor:
          name: Außentemperatursensor
          description: Sensor der die Außentemperatur misst. Wird für Schwellenwert-
            Checks (Heizen/Kühlen sinnvoll?) und für den adaptiven Cooling-Target
            verwendet.
          selector:
            entity:
              domain:
              - sensor
              device_class:
              - temperature
              reorder: false
              multiple: false
    section_thermostat_fenster:
      name: Thermostat & Fenster
      icon: mdi:thermometer-lines
      input:
        thermostat_entity:
          name: Fußbodenheizung / Thermostat (optional)
          description: 'Wird auf "off" gesetzt sobald die Klimaanlage läuft. Wird
            wieder auf "heat" gesetzt wenn die Klimaanlage stoppt und Heizen sinnvoll
            ist (Außentemp. unter Heiz-Obergrenze).

            '
          default:
          selector:
            entity:
              domain:
              - climate
              reorder: false
              multiple: false
        window_sensor:
          name: Fenstersensor (optional)
          description: 'Klimaanlage startet nicht bei geöffnetem Fenster. Läuft die
            Klimaanlage und das Fenster öffnet, schaltet sie sofort ab (Thermostat
            wird dabei NICHT wiederhergestellt).

            '
          default:
          selector:
            entity:
              domain:
              - binary_sensor
              device_class:
              - window
              - opening
              reorder: false
              multiple: false
    section_praesenz:
      name: Anwesenheit
      icon: mdi:account-group
      input:
        presence_sensor:
          name: Anwesenheitssensor (optional)
          description: 'Klimaanlage startet nicht wenn niemand zuhause ist und schaltet
            ab, sobald alle das Haus verlassen. Erwartet binary_sensor: ''on'' =
            jemand zuhause, ''off'' = niemand zuhause.

            '
          default:
          selector:
            entity:
              domain:
              - binary_sensor
              reorder: false
              multiple: false
        presence_required:
          name: Anwesenheit erforderlich
          description: Wenn aktiv, läuft die Klimaanlage nur bei Anwesenheit. Aus
            = Sensor wird ignoriert.
          default: true
          selector:
            boolean: {}
        room_presence_sensor:
          name: Raumpräsenzsensor (optional)
          description: 'Zusätzlicher Sensor für die Raumebene (z.B. mmWave/PIR). AC
            läuft nur wenn jemand im Raum ist. ''on'' = Person im Raum, ''off'' =
            niemand im Raum. Leer lassen oder "Raumpräsenz erforderlich" deaktivieren
            um die Raum-Ebene zu überspringen.

            '
          default:
          selector:
            entity:
              domain:
              - binary_sensor
              reorder: false
              multiple: false
        room_presence_required:
          name: Raumpräsenz erforderlich
          description: Wenn aktiv, läuft die Klimaanlage nur bei Raumpräsenz. Aus
            = Sensor wird ignoriert.
          default: true
          selector:
            boolean: {}
        room_presence_grace_minutes:
          name: Raumpräsenz Nachlaufzeit (Minuten)
          description: 'AC bleibt nach Verlassen des Raums noch X Minuten an, bevor
            sie abschaltet. Vermeidet ständiges An/Aus bei kurzer Abwesenheit (z.B.
            Toilette).

            '
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider
        room_presence_settle_minutes:
          name: Raumpräsenz Einschaltverzögerung (Minuten)
          description: 'Der Raum muss erst X Minuten DURCHGEHEND belegt sein, bevor
            die Klimaanlage automatisch startet. Verhindert das Anspringen bei kurzem
            Betreten (z.B. nur etwas holen). Verlässt man den Raum vor Ablauf der Zeit,
            startet die AC nicht. 0 = sofort starten (keine Karenz). Wirkt nur auf das
            Einschalten — eine bereits laufende AC bleibt unberührt.

            '
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
    section_urlaub:
      name: Urlaub
      icon: mdi:beach
      input:
        vacation_boolean:
          name: Urlaubs-Schalter
          description: 'Wenn ON, wird die Klimaanlage komplett gesperrt (off) und
            das Thermostat ausgeschaltet. Frostschutz übernimmt das Thermostat selbst.

            '
          default:
          selector:
            entity:
              domain:
              - input_boolean
              - binary_sensor
              reorder: false
              multiple: false
        vacation_required:
          name: Urlaubsmodus aktiv
          description: Wenn aus, wird der Urlaubsschalter ignoriert.
          default: true
          selector:
            boolean: {}
    section_selbstregelung:
      name: Selbstregelung
      icon: mdi:autorenew
      input:
        self_regulate:
          name: Selbstregelung erlauben
          description: 'Wenn aktiv, wird das automatische Abschalten beim Wegfall
            der Trigger-Bedingung unterdrückt — die Klimaanlage darf intern selbst
            zur Zieltemperatur regeln. Fenster-offen schaltet weiterhin ab (Sicherheit).

            '
          default: true
          selector:
            boolean: {}
    section_zeit:
      name: Zeitfenster
      icon: mdi:clock-outline
      input:
        time_start:
          name: Aktiv ab
          description: Früheste Uhrzeit für automatisches Einschalten
          default: 07:00:00
          selector:
            time: {}
        time_end:
          name: Aktiv bis
          description: Späteste Uhrzeit für automatisches Einschalten
          default: '22:00:00'
          selector:
            time: {}
    section_modi:
      name: Modi (Eco / Super / Sleep)
      icon: mdi:tune-variant
      input:
        eco_switch:
          name: Eco-Switch (optional)
          description: 'Switch der den Eco-Modus der Klimaanlage steuert (typisch von
            der ConnectLife-Integration als switch.<ac_name>_eco bereitgestellt).
            Wird in der konfigurierten Eco-Phase automatisch eingeschaltet, sonst
            ausgeschaltet. Ist die Klimaanlage aus, wird Eco ebenfalls deaktiviert.

            '
          default:
          selector:
            entity:
              domain:
              - switch
              reorder: false
              multiple: false
        eco_enabled:
          name: Eco-Phase aktiv
          description: 'Wenn aus, wird die Eco-Phase ignoriert (Eco-Switch wird nie automatisch
            gesetzt).

            '
          default: false
          selector:
            boolean: {}
        eco_time_start:
          name: Eco-Phase ab
          description: Uhrzeit ab der Eco aktiviert wird (nur wenn AC läuft).
          default: '20:00:00'
          selector:
            time: {}
        eco_time_end:
          name: Eco-Phase bis
          description: 'Uhrzeit ab der Eco wieder deaktiviert wird. Eco und Sleep dürfen
            sich überlappen — beide laufen dann parallel.

            '
          default: '22:00:00'
          selector:
            time: {}
        super_switch:
          name: Super/Turbo-Switch (optional)
          description: 'Switch der den Super-/Turbo-Modus der Klimaanlage steuert (typisch
            switch.<ac_name>_super). Wird kurz nach dem automatischen Anschalten der
            Kühlung für X Minuten aktiviert (siehe Boost-Dauer), um schnell auf
            Zieltemperatur zu kommen.

            '
          default:
          selector:
            entity:
              domain:
              - switch
              reorder: false
              multiple: false
        boost_enabled:
          name: Boost (Super) beim Start
          description: 'Wenn aktiv, wird Super in den ersten X Minuten nach dem automatischen
            Einschalten der Kühlung aktiviert.

            '
          default: false
          selector:
            boolean: {}
        boost_minutes:
          name: Boost-Dauer (Minuten)
          description: Wie lange Super nach dem Einschalten an bleibt.
          default: 10
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
        sleep_select:
          name: Sleep-Mode-Select (optional)
          description: 'Select-Entity die den Sleep-Modus der Klimaanlage steuert
            (typisch select.<ac_name>_sleep_mode bei ConnectLife). Erwartete Optionen:
            off / general / for_old / for_young / for_kid.

            '
          default:
          selector:
            entity:
              domain:
              - select
              reorder: false
              multiple: false
        sleep_enabled:
          name: Sleep-Phase aktiv
          description: Wenn aus, wird die Sleep-Phase ignoriert (Sleep-Select wird nie
            automatisch gesetzt).
          default: false
          selector:
            boolean: {}
        sleep_profile:
          name: Sleep-Profil
          description: 'Welches Sleep-Profil in der Sleep-Phase gesetzt wird. Profile
            entsprechen den vom Gerät angebotenen Sleep-Kurven: general (Standard-
            Erwachsene), for_old (Senioren), for_young (Jugendliche/junge Erwachsene),
            for_kid (Kinder — langsamerer Temperatur-Drift, leiser Lüfter).

            '
          default: general
          selector:
            select:
              options:
              - general
              - for_old
              - for_young
              - for_kid
        sleep_time_start:
          name: Sleep-Phase ab
          description: Uhrzeit ab der Sleep-Modus aktiviert wird (nur wenn AC läuft).
          default: '21:00:00'
          selector:
            time: {}
        sleep_time_end:
          name: Sleep-Phase bis
          description: Uhrzeit ab der Sleep wieder deaktiviert wird (z.B. gleich dem
            globalen time_end).
          default: '22:00:00'
          selector:
            time: {}
        modi_weekdays:
          name: Modi-Wochentage
          description: 'Wochentage, an denen Eco- und Sleep-Phase aktiv sind. Typischer
            Use-Case: Kinderzimmer nur an Schulabenden (Mo/Di/Mi/Do/So), an Wochenenden
            (Fr/Sa) ist das Kind ggf. nicht im Zimmer. Leer lassen = jeden Tag aktiv.

            '
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              options:
              - label: Montag
                value: mon
              - label: Dienstag
                value: tue
              - label: Mittwoch
                value: wed
              - label: Donnerstag
                value: thu
              - label: Freitag
                value: fri
              - label: Samstag
                value: sat
              - label: Sonntag
                value: sun
    section_effizienz:
      name: Effizienz
      icon: mdi:leaf
      input:
        cool_adaptive_target_enabled:
          name: Adaptiver Cooling-Target aktiv
          description: 'Wenn aktiv, wird die Innentemperatur nie tiefer als (Außentemp.
            − Δ) gekühlt (siehe nächster Wert). Schont Kompressor und Gesundheit.
            Aus = der eingestellte Zieltemperatur-Wert wird IMMER verwendet, unabhängig
            von der Außentemperatur (bei 35 °C draußen wird also auch wirklich auf
            z.B. 23 °C gekühlt).

            '
          default: true
          selector:
            boolean: {}
        cool_max_delta_t:
          name: Max. Δ Innen−Außen Kühlen (°C)
          description: 'Nur wirksam wenn „Adaptiver Cooling-Target aktiv" eingeschaltet
            ist. Innentemperatur wird nie tiefer als (Außentemp. − dieser Wert) gekühlt.
            Bei 30 °C draußen und Δ=7 → effektiver Target ≥ 23 °C statt 21 °C. Schont
            Kompressor + Gesundheit, spart 15-25 %.

            '
          default: 7.0
          selector:
            number:
              min: 4.0
              max: 12.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        min_cycle_minutes:
          name: Min. Pause nach Aus (Minuten)
          description: 'Klimaanlage darf nach dem Abschalten frühestens nach X Minuten
            wieder starten. Verhindert Kurztakten (Kompressor-Schutz + Effizienz).

            '
          default: 5
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
    section_kuehlen:
      name: Kühlen
      icon: mdi:snowflake
      input:
        cool_enabled:
          name: Kühlen aktivieren
          default: true
          selector:
            boolean: {}
        cool_room_trigger:
          name: Raumtemp. Einschaltgrenze (°C)
          description: Kühlen starten wenn Raumtemperatur diesen Wert übersteigt
          default: 26.0
          selector:
            number:
              min: 20.0
              max: 35.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        cool_outdoor_min:
          name: Außentemp. Mindestgrenze (°C)
          description: 'Kühlen nur wenn Außentemperatur über diesem Wert. Verhindert
            Kühlen im Frühjahr/Herbst wenn Lüften sinnvoller wäre.

            '
          default: 18.0
          selector:
            number:
              min: 10.0
              max: 30.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        cool_vent_priority_enabled:
          name: Lüften-Vorrang aktiv
          description: 'Wenn aktiv, wird NICHT eingeschaltet solange es draußen deutlich
            kühler ist als im Raum (Differenz größer als der nächste Wert) — dann ist
            Lüften die effizientere Wahl. Greift nur beim automatischen Einschalten;
            ein bereits laufender Kühlbetrieb wird davon nicht gestoppt. Bei Hitze
            (außen wärmer als innen) ist die Differenz negativ → Kühlen immer erlaubt.

            '
          default: true
          selector:
            boolean: {}
        cool_vent_max_delta:
          name: Lüften-Vorrang ab Δ Innen−Außen (°C)
          description: 'Nur wirksam wenn „Lüften-Vorrang aktiv". Das automatische Einschalten
            der Kühlung wird unterdrückt sobald (Raumtemp. − Außentemp.) diesen Wert
            übersteigt. Beispiel: Raum 23,5 °C, außen 18 °C → Δ 5,5 °C; bei Schwelle
            4 °C wird nicht gekühlt sondern auf Lüften gesetzt.

            '
          default: 4.0
          selector:
            number:
              min: 1.0
              max: 12.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        cool_room_hard_max:
          name: Harte Kühl-Obergrenze (°C)
          description: 'Ab dieser Raumtemperatur wird IMMER gekühlt — der „Lüften-Vorrang"
            wird ausgehebelt. Schützt vor internen Wärmequellen (3D-Drucker, PC, Sonne),
            wenn Lüften die Hitze nicht abführt. Sollte über der Einschaltgrenze liegen;
            der Lüften-Vorrang gilt dann nur im Band zwischen Einschaltgrenze und diesem
            Wert.

            '
          default: 27.0
          selector:
            number:
              min: 24.0
              max: 32.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        cool_target_temp:
          name: Zieltemperatur Kühlen (°C)
          default: 23.0
          selector:
            number:
              min: 16.0
              max: 28.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        cool_hysteresis:
          name: Hysterese Kühlen (°C)
          description: Abschalten wenn Raumtemp. ≤ Ziel − Hysterese
          default: 1.5
          selector:
            number:
              min: 0.5
              max: 5.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
    section_heizen:
      name: Heizen
      icon: mdi:fire
      input:
        heat_enabled:
          name: Heizen aktivieren
          default: true
          selector:
            boolean: {}
        heat_room_trigger:
          name: Raumtemp. Einschaltgrenze (°C)
          description: Heizen starten wenn Raumtemperatur unter diesen Wert fällt
          default: 18.0
          selector:
            number:
              min: 10.0
              max: 24.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        heat_outdoor_max:
          name: Außentemp. Obergrenze Heizen (°C)
          description: Heizen nur wenn Außentemperatur unter diesem Wert
          default: 12.0
          selector:
            number:
              min: 5.0
              max: 20.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        heat_outdoor_min:
          name: Außentemp. Effizienzgrenze (°C)
          description: 'Nicht heizen wenn Außentemperatur darunter liegt (COP zu schlecht
            → Fußbodenheizung effizienter).

            '
          default: -10.0
          selector:
            number:
              min: -25.0
              max: 0.0
              step: 1.0
              unit_of_measurement: °C
              mode: slider
        heat_target_temp:
          name: Zieltemperatur Heizen (°C)
          default: 21.0
          selector:
            number:
              min: 16.0
              max: 26.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
        heat_hysteresis:
          name: Hysterese Heizen (°C)
          description: Abschalten wenn Raumtemp. ≥ Ziel + Hysterese
          default: 1.0
          selector:
            number:
              min: 0.5
              max: 5.0
              step: 0.5
              unit_of_measurement: °C
              mode: slider
mode: single
max_exceeded: silent
trigger:
- trigger: state
  entity_id: !input room_temp_sensor
  id: temp_change
- trigger: state
  entity_id: !input outdoor_temp_sensor
  id: temp_change
- trigger: time_pattern
  minutes: /10
  id: temp_change
- trigger: state
  entity_id: !input window_sensor
  to: 'on'
  id: window_opened
- trigger: state
  entity_id: !input window_sensor
  to: 'off'
  id: window_closed
- trigger: state
  entity_id: !input presence_sensor
  to: 'off'
  id: presence_left
- trigger: state
  entity_id: !input presence_sensor
  to: 'on'
  id: presence_arrived
- trigger: state
  entity_id: !input room_presence_sensor
  to: 'on'
  for:
    minutes: !input room_presence_settle_minutes
  id: room_presence_arrived
- trigger: state
  entity_id: !input room_presence_sensor
  to: 'off'
  for:
    minutes: !input room_presence_grace_minutes
  id: room_presence_left
- trigger: state
  entity_id: !input vacation_boolean
  to: 'on'
  id: vacation_started
- trigger: state
  entity_id: !input vacation_boolean
  to: 'off'
  id: vacation_ended
- trigger: homeassistant
  event: start
  id: temp_change
- trigger: event
  event_type: automation_reloaded
  id: temp_change
- trigger: time
  at: !input time_start
  id: time_window_start
- trigger: time
  at: !input time_end
  id: time_window_end
- trigger: time
  at: !input eco_time_start
  id: eco_window_start
- trigger: time
  at: !input eco_time_end
  id: eco_window_end
- trigger: time
  at: !input sleep_time_start
  id: sleep_window_start
- trigger: time
  at: !input sleep_time_end
  id: sleep_window_end
- trigger: time_pattern
  minutes: /5
  id: modi_tick
variables:
  _room_sensor: !input room_temp_sensor
  _outdoor_sensor: !input outdoor_temp_sensor
  _climate: !input climate_entity
  _thermostat: !input thermostat_entity
  _window: !input window_sensor
  _presence: !input presence_sensor
  _presence_required: !input presence_required
  _room_presence: !input room_presence_sensor
  _room_presence_required: !input room_presence_required
  _room_presence_grace: !input room_presence_grace_minutes
  _room_presence_settle: !input room_presence_settle_minutes
  _vacation: !input vacation_boolean
  _vacation_required: !input vacation_required
  _cool_adaptive_enabled: !input cool_adaptive_target_enabled
  _cool_max_delta: !input cool_max_delta_t
  _min_cycle: !input min_cycle_minutes
  _self_regulate: !input self_regulate
  _cool_enabled: !input cool_enabled
  _heat_enabled: !input heat_enabled
  _cool_trigger: !input cool_room_trigger
  _cool_outdoor_min: !input cool_outdoor_min
  _cool_vent_priority_enabled: !input cool_vent_priority_enabled
  _cool_vent_max_delta: !input cool_vent_max_delta
  _cool_room_hard_max: !input cool_room_hard_max
  _cool_target: !input cool_target_temp
  _cool_hyst: !input cool_hysteresis
  _heat_trigger: !input heat_room_trigger
  _heat_outdoor_max: !input heat_outdoor_max
  _heat_outdoor_min: !input heat_outdoor_min
  _heat_target: !input heat_target_temp
  _heat_hyst: !input heat_hysteresis
  _time_start: !input time_start
  _time_end: !input time_end
  _eco_switch: !input eco_switch
  _eco_enabled: !input eco_enabled
  _eco_start: !input eco_time_start
  _eco_end: !input eco_time_end
  _super_switch: !input super_switch
  _boost_enabled: !input boost_enabled
  _boost_minutes: !input boost_minutes
  _sleep_select: !input sleep_select
  _sleep_enabled: !input sleep_enabled
  _sleep_profile: !input sleep_profile
  _sleep_start: !input sleep_time_start
  _sleep_end: !input sleep_time_end
  _modi_weekdays: !input modi_weekdays
condition:
- condition: template
  value_template: '{{ states(_room_sensor) not in [''unavailable'', ''unknown'', ''none'']
    }}

    '
- condition: template
  value_template: '{{ states(_outdoor_sensor) not in [''unavailable'', ''unknown'',
    ''none''] }}

    '
- condition: template
  value_template: '{{ states(_climate) not in [''unavailable'', ''unknown''] }}

    '
action:
- variables:
    room_temp: '{{ states(_room_sensor) | float(20) }}'
    outdoor_temp: '{{ states(_outdoor_sensor) | float(15) }}'
    current_mode: '{{ states(_climate) }}'
    in_time_window: '{{ today_at(_time_start) <= now() < today_at(_time_end) }}'
    window_open: "{{ _window not in [none, '']\n   and is_state(_window | string,
      'on') }}\n"
    nobody_home: "{{ _presence_required\n   and _presence not in [none, '']\n   and
      is_state(_presence | string, 'off') }}\n"
    room_empty: "{{ _room_presence_required and _room_presence not in [none, ''] and is_state(_room_presence | string, 'off') and (now() - states[_room_presence].last_changed).total_seconds() >= (_room_presence_grace * 60) }}"
    no_presence: '{{ nobody_home or room_empty }}'
    room_settled: "{{ (not _room_presence_required) or (_room_presence in [none, '']) or (is_state(_room_presence | string, 'on') and (now() - states[_room_presence].last_changed).total_seconds() >= (_room_presence_settle * 60)) }}"
    is_vacation: "{{ _vacation_required\n   and _vacation not in [none, '']\n   and
      is_state(_vacation | string, 'on') }}\n"
    effective_cool_target: "{{ ([_cool_target, (outdoor_temp - _cool_max_delta)] |
      max | round(1)) if _cool_adaptive_enabled else _cool_target }}\n"
    last_off_seconds: "{{ (now() - states[_climate].last_changed).total_seconds()\n
      \  if states[_climate] is not none else 99999 }}\n"
    cycle_ready: "{{ current_mode != 'off' or last_off_seconds >= (_min_cycle * 60)
      }}\n"
    has_thermostat: '{{ _thermostat not in [none, ''''] }}'
    self_regulate: '{{ _self_regulate }}'
    thermostat_in_heat_range: '{{ outdoor_temp <= _heat_outdoor_max }}'
    vent_preferred: '{{ _cool_vent_priority_enabled and (room_temp - outdoor_temp)
      > _cool_vent_max_delta and room_temp < _cool_room_hard_max }}'
    want_cool: "{{ _cool_enabled\n   and not window_open\n   and not no_presence\n
      \  and not is_vacation\n   and outdoor_temp >= _cool_outdoor_min\n   and room_temp
      >= _cool_trigger }}\n"
    want_heat: "{{ _heat_enabled\n   and not window_open\n   and not no_presence\n
      \  and not is_vacation\n   and outdoor_temp <= _heat_outdoor_max\n   and outdoor_temp
      >= _heat_outdoor_min\n   and room_temp <= _heat_trigger }}\n"
    cool_done: '{{ room_temp <= (effective_cool_target - _cool_hyst) }}'
    heat_done: '{{ room_temp >= (_heat_target + _heat_hyst) }}'
    climate_running: "{{ current_mode in ['cool', 'heat', 'dry', 'fan_only', 'auto'] }}"
    weekday_short: "{{ now().strftime('%a').lower() }}"
    weekday_ok: "{{ (_modi_weekdays | length) == 0 or weekday_short in _modi_weekdays }}"
    in_eco_window: "{% set s = today_at(_eco_start) %}{% set e = today_at(_eco_end) %}{% if s <= e %}{{ s <= now() < e }}{% else %}{{ now() >= s or now() < e }}{% endif %}"
    in_sleep_window: "{% set s = today_at(_sleep_start) %}{% set e = today_at(_sleep_end) %}{% if s <= e %}{{ s <= now() < e }}{% else %}{{ now() >= s or now() < e }}{% endif %}"
    has_eco_switch: "{{ _eco_switch not in [none, ''] }}"
    has_super_switch: "{{ _super_switch not in [none, ''] }}"
    has_sleep_select: "{{ _sleep_select not in [none, ''] }}"
    cool_active_seconds: "{{ (now() - states[_climate].last_changed).total_seconds() if (states[_climate] is not none and current_mode == 'cool') else 0 }}"
    in_boost_window: "{{ _boost_enabled and current_mode == 'cool' and cool_active_seconds <= (_boost_minutes * 60) }}"
    manual_override: "{% set ws = today_at(_time_start) %}{% set last_ws = ws if now() >= ws else ws - timedelta(days=1) %}{{ states[_climate] is not none and states[_climate].context.user_id is not none and states[_climate].last_changed >= last_ws }}"
- choose:
  - conditions:
    - condition: template
      value_template: "{{ is_vacation and current_mode not in ['off', 'unavailable'] }}"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: 'off'
    - if:
      - condition: template
        value_template: '{{ has_thermostat }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ _thermostat }}'
        data:
          hvac_mode: 'off'
  - conditions:
    - condition: trigger
      id: window_opened
    - condition: template
      value_template: '{{ current_mode not in [''off'', ''unavailable''] }}'
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: 'off'
  - conditions:
    - condition: template
      value_template: "{{ no_presence and not manual_override and current_mode not in ['off', 'unavailable'] }}"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: 'off'
  - conditions:
    - condition: template
      value_template: "{{ not in_time_window and not manual_override and current_mode not in ['off', 'unavailable'] }}"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: 'off'
    - if:
      - condition: template
        value_template: "{{ has_thermostat and thermostat_in_heat_range and not window_open }}"
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ _thermostat }}'
        data:
          hvac_mode: heat
  - conditions:
    - condition: template
      value_template: "{{ want_cool\n   and not cool_done\n   and in_time_window\n
        \  and cycle_ready\n   and not manual_override\n   and not vent_preferred\n   and room_settled\n   and current_mode not in ['cool', 'unavailable'] }}\n"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: cool
    - action: climate.set_temperature
      target:
        entity_id: !input climate_entity
      data:
        temperature: '{{ effective_cool_target }}'
    - if:
      - condition: template
        value_template: '{{ has_thermostat }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ _thermostat }}'
        data:
          hvac_mode: 'off'
  - conditions:
    - condition: template
      value_template: "{{ want_heat\n   and not heat_done\n   and in_time_window\n
        \  and cycle_ready\n   and not manual_override\n   and room_settled\n   and current_mode not in ['heat', 'unavailable'] }}\n"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: heat
    - action: climate.set_temperature
      target:
        entity_id: !input climate_entity
      data:
        temperature: !input heat_target_temp
    - if:
      - condition: template
        value_template: '{{ has_thermostat }}'
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ _thermostat }}'
        data:
          hvac_mode: 'off'
  - conditions:
    - condition: template
      value_template: "{{ current_mode == 'cool'\n   and (cool_done or not want_cool)\n
        \  and not self_regulate\n   and not manual_override }}\n"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: 'off'
    - if:
      - condition: template
        value_template: '{{ has_thermostat and thermostat_in_heat_range and not window_open
          }}

          '
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ _thermostat }}'
        data:
          hvac_mode: heat
  - conditions:
    - condition: template
      value_template: "{{ current_mode == 'heat'\n   and (heat_done or not want_heat)\n
        \  and not self_regulate\n   and not manual_override }}\n"
    sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: !input climate_entity
      data:
        hvac_mode: 'off'
    - if:
      - condition: template
        value_template: '{{ has_thermostat and thermostat_in_heat_range and not window_open
          }}

          '
      then:
      - action: climate.set_hvac_mode
        target:
          entity_id: '{{ _thermostat }}'
        data:
          hvac_mode: heat
- variables:
    current_mode_after: '{{ states(_climate) }}'
    climate_running_after: "{{ current_mode_after in ['cool', 'heat', 'dry', 'fan_only', 'auto'] }}"
    cool_active_seconds_after: "{{ (now() - states[_climate].last_changed).total_seconds() if (states[_climate] is not none and current_mode_after == 'cool') else 0 }}"
    in_boost_window_after: "{{ _boost_enabled and current_mode_after == 'cool' and cool_active_seconds_after <= (_boost_minutes * 60) }}"
- if:
  - condition: template
    value_template: "{{ has_super_switch and not manual_override }}"
  then:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ in_boost_window_after and weekday_ok and is_state(_super_switch | string, 'off') }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: '{{ _super_switch }}'
    - conditions:
      - condition: template
        value_template: "{{ (not in_boost_window_after or not weekday_ok or not climate_running_after) and is_state(_super_switch | string, 'on') }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: '{{ _super_switch }}'
- if:
  - condition: template
    value_template: "{{ has_eco_switch and not manual_override }}"
  then:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ _eco_enabled and in_eco_window and weekday_ok and climate_running_after and is_state(_eco_switch | string, 'off') }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: '{{ _eco_switch }}'
    - conditions:
      - condition: template
        value_template: "{{ (not _eco_enabled or not in_eco_window or not weekday_ok or not climate_running_after) and is_state(_eco_switch | string, 'on') }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: '{{ _eco_switch }}'
- if:
  - condition: template
    value_template: "{{ has_sleep_select and not manual_override }}"
  then:
  - variables:
      current_sleep: "{{ states(_sleep_select) }}"
      want_sleep: "{{ _sleep_enabled and in_sleep_window and weekday_ok and climate_running_after }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ want_sleep and current_sleep != _sleep_profile }}"
      sequence:
      - action: select.select_option
        target:
          entity_id: '{{ _sleep_select }}'
        data:
          option: '{{ _sleep_profile }}'
    - conditions:
      - condition: template
        value_template: "{{ not want_sleep and current_sleep != 'off' }}"
      sequence:
      - action: select.select_option
        target:
          entity_id: '{{ _sleep_select }}'
        data:
          option: 'off'
