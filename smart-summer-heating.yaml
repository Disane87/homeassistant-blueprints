blueprint:
  name: "🌞 Heizung Sommermodus (Smart)"
  description: >
    Schaltet Thermostate automatisch AUS wenn die Außentemperatur über einem
    Schwellwert liegt – und wieder EIN wenn sie darunter fällt. Die Prüfung läuft
    kontinuierlich (bei jeder Sensoränderung und zusätzlich alle 15 Minuten),
    nicht nur zu festen Zeitpunkten. Zwischen den beiden Schwellwerten gilt eine
    Hysterese (es passiert nichts). Das normale Heizprogramm läuft danach
    unverändert weiter. Tipp: Für stabile Ergebnisse einen 24h-Mittelwert-Sensor
    (Statistik-Helfer) als Durchschnittssensor angeben, damit Tag/Nacht-Schwankungen
    nicht ständig umschalten. Optional: wöchentliche Ventilübung.
  domain: automation
  author: "marco@disane.dev"
  homeassistant:
    min_version: "2024.6.0"

  input:

    outdoor_temp_sensor:
      name: "Außentemperatursensor"
      description: "Sensor der die aktuelle Außentemperatur liefert."
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outdoor_temp_avg_sensor:
      name: "Durchschnitts-Sensor (optional, empfohlen)"
      description: >
        Sensor mit gemittelter Außentemperatur, z.B. ein Statistik-Helfer
        (Mittelwert über 24h) auf dem Außentemperatursensor. Wenn gesetzt, wird
        dieser Wert für die Entscheidung verwendet, sonst der aktuelle Wert.
      default: ""
      selector:
        entity:
          domain: sensor

    climate_targets:
      name: "Thermostate"
      description: "Wähle alle Thermostate aus. Mehrfachauswahl möglich."
      selector:
        entity:
          domain: climate
          multiple: true

    ac_targets:
      name: "Klimaanlagen pro Raum (optional)"
      description: >
        Klimaanlagen/Split-Geräte, die im Winter mitheizen. Sie werden wie die
        Thermostate im Sommermodus ausgeschaltet und im Herbst wieder eingeschaltet.
        Mehrere Räume möglich. Von der Ventilübung ausgenommen.
      default: []
      selector:
        entity:
          domain: climate
          multiple: true

    summer_on_threshold:
      name: "Einschalt-Schwellwert Sommermodus"
      description: "Liegt die Temperatur über diesem Wert, werden die Thermostate ausgeschaltet."
      default: 15
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

    summer_off_threshold:
      name: "Ausschalt-Schwellwert (Hysterese)"
      description: "Liegt die Temperatur unter diesem Wert, werden die Thermostate wieder eingeschaltet."
      default: 12
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider


    valve_exercise_enabled:
      name: "Wöchentliche Ventilübung aktivieren"
      description: "Schaltet die Thermostate einmal pro Woche kurz EIN und wieder AUS um Festsitzen zu verhindern."
      default: true
      selector:
        boolean:

    valve_exercise_day:
      name: "Wochentag der Ventilübung"
      description: "0=Montag, 1=Dienstag, 2=Mittwoch, 3=Donnerstag, 4=Freitag, 5=Samstag, 6=Sonntag"
      default: 0
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box

    valve_exercise_time:
      name: "Uhrzeit der Ventilübung"
      default: "10:00:00"
      selector:
        time:

    valve_exercise_duration:
      name: "Dauer der Ventilübung (Minuten)"
      default: 10
      selector:
        number:
          min: 2
          max: 30
          step: 1
          unit_of_measurement: "min"
          mode: box

    notify_service:
      name: "Benachrichtigungsdienst (optional)"
      description: "z.B. notify.telegram. Leer lassen um Benachrichtigungen zu deaktivieren."
      default: ""
      selector:
        text:

variables:
  notify_service: !input notify_service
  valve_exercise_enabled: !input valve_exercise_enabled
  valve_exercise_day: !input valve_exercise_day
  valve_exercise_duration: !input valve_exercise_duration
  outdoor_temp_sensor: !input outdoor_temp_sensor
  outdoor_temp_avg_sensor: !input outdoor_temp_avg_sensor
  climate_targets: !input climate_targets
  ac_targets: !input ac_targets
  all_targets: "{{ (climate_targets + ac_targets) | unique | list }}"
  summer_on_threshold: !input summer_on_threshold
  summer_off_threshold: !input summer_off_threshold
  # Für die Entscheidung genutzter Wert: Durchschnittssensor, sonst aktueller Wert
  eval_entity: >
    {{ outdoor_temp_avg_sensor if outdoor_temp_avg_sensor else outdoor_temp_sensor }}
  eval_temp: "{{ states(eval_entity) }}"
  # Thermostate, die gerade nicht aus (und erreichbar) sind
  heating_active: >
    {{ expand(all_targets) | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) | map(attribute='entity_id') | list }}
  # Thermostate, die gerade aus sind
  heating_off: >
    {{ expand(all_targets) | selectattr('state', 'eq', 'off') | map(attribute='entity_id') | list }}

# Während der Ventilübung (delay) werden weitere Auslöser bewusst verworfen
mode: single
max_exceeded: silent

trigger:

  # Kontinuierlich: bei jeder Änderung des Außensensors (der Durchschnittssensor
  # wird über den zyklischen Trigger erfasst)
  - platform: state
    id: "pruefen"
    entity_id: !input outdoor_temp_sensor

  # Zusätzlich zyklisch, damit auch ohne Sensoränderung geprüft wird
  - platform: time_pattern
    id: "pruefen"
    minutes: "/15"

  # Nach einem Neustart sofort prüfen
  - platform: homeassistant
    id: "pruefen"
    event: start

  - platform: time
    id: "ventil_uebung"
    at: !input valve_exercise_time

condition: []

action:
  - choose:

      # Sommermodus: zu warm -> alles ausschalten, was noch an ist
      - conditions:
          - condition: trigger
            id: "pruefen"
          - condition: template
            value_template: "{{ is_number(eval_temp) }}"
          - condition: template
            value_template: "{{ eval_temp | float > summer_on_threshold | float }}"
          - condition: template
            value_template: "{{ heating_active | count > 0 }}"
        sequence:
          - alias: "Thermostate ausschalten"
            service: climate.turn_off
            target:
              entity_id: "{{ heating_active }}"
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "🌞 Sommermodus aktiv"
                  message: >
                    Thermostate wurden ausgeschaltet
                    ({{ eval_temp }}°C > {{ summer_on_threshold }}°C).

      # Heizsaison: zu kalt -> alles einschalten, was aus ist
      - conditions:
          - condition: trigger
            id: "pruefen"
          - condition: template
            value_template: "{{ is_number(eval_temp) }}"
          - condition: template
            value_template: "{{ eval_temp | float < summer_off_threshold | float }}"
          - condition: template
            value_template: "{{ heating_off | count > 0 }}"
        sequence:
          - alias: "Thermostate einschalten"
            service: climate.turn_on
            target:
              entity_id: "{{ heating_off }}"
          - if:
              - condition: template
                value_template: "{{ notify_service != '' }}"
            then:
              - service: "{{ notify_service }}"
                data:
                  title: "🍂 Heizsaison beginnt"
                  message: >
                    Thermostate wurden wieder eingeschaltet
                    ({{ eval_temp }}°C < {{ summer_off_threshold }}°C).

      # Wöchentliche Ventilübung (nur im Sommermodus)
      - conditions:
          - condition: trigger
            id: "ventil_uebung"
          - condition: template
            value_template: "{{ valve_exercise_enabled }}"
          - condition: template
            value_template: "{{ now().weekday() == valve_exercise_day | int }}"
          - condition: template
            value_template: "{{ is_number(eval_temp) and eval_temp | float > summer_on_threshold | float }}"
        sequence:
          - alias: "Ventile kurz einschalten"
            service: climate.turn_on
            target:
              entity_id: !input climate_targets
          - delay:
              minutes: "{{ valve_exercise_duration }}"
          - alias: "Ventile wieder ausschalten"
            service: climate.turn_off
            target:
              entity_id: !input climate_targets
